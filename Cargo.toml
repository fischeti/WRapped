[package]
name = "wrapped"
authors = ["Tim Fischer <fischeti@iis.ee.ethz.ch>"]
repository = "https://github.com/fischeti/WRapped"
description = "Wrapped but for Weekly Reports"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.1"
chrono = "0.4.31"
clap = { version = "4.4.11", features = ["derive"] }
colored = "3.1.1"
imap = "3.0.0-alpha.12"
imap-proto = "0.16.3"
itertools = "0.12.0"
keyring = "4.1.6"
log = "0.4.20"
mailparse = "0.14.1"
mime_guess = "2.0.4"
native-tls = "0.2.11"
open = "5.0.1"
pretty_env_logger = "0.5.0"
rpassword = "7.3.1"
rust-embed = "8.2.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
toml = "0.8.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
